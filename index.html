<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Solid Arts HR — Staff Portal</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Solid Arts Creativity Studio staff portal: check in from your phone, apply for leave and see company announcements.">
  <meta name="author" content="Solid Arts Creativity Studio">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://hr.solidarts.co.zw/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hr.solidarts.co.zw/">
  <meta property="og:title" content="Solid Arts HR — Staff Portal">
  <meta property="og:description" content="Solid Arts Creativity Studio staff portal: check in, apply for leave and see announcements.">
  <!-- PNG, not WebP: Facebook, LinkedIn, X, and WhatsApp do not render WebP in
       link previews, so a .webp here yields a card with no image at all.
       Explicit dimensions and type make the large card render on first scrape. -->
  <meta property="og:image" content="https://solidarts.co.zw/wp-content/uploads/2025/06/cropped-solid-arts-icon.webp">
  <meta property="og:image:secure_url" content="https://solidarts.co.zw/wp-content/uploads/2025/06/cropped-solid-arts-icon.webp">
  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Solid Arts Creativity Studio logo">
  <meta property="og:site_name" content="Solid Arts HR">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Solid Arts HR — Staff Portal">
  <meta name="twitter:description" content="Solid Arts Creativity Studio staff portal: check in, apply for leave and see announcements.">
  <meta name="twitter:image" content="https://solidarts.co.zw/wp-content/uploads/2025/06/cropped-solid-arts-icon.webp">
  <meta name="twitter:image:alt" content="Solid Arts Creativity Studio logo">

  <!-- PWA & iOS Specific Meta Tags -->
  <meta name="theme-color" content="#9C0021">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Solid Arts HR">


  <!-- High Quality Icons for iOS -->
  <link rel="apple-touch-icon" href="https://solidarts.co.zw/wp-content/uploads/2025/06/cropped-solid-arts-icon-180x180.webp">
  <link rel="apple-touch-icon" sizes="180x180" href="https://solidarts.co.zw/wp-content/uploads/2025/06/cropped-solid-arts-icon-180x180.webp">
  
  <link rel="icon" type="image/webp" href="https://solidarts.co.zw/wp-content/uploads/2025/06/cropped-solid-arts-icon-32x32.webp">
  <!-- Vital: Link to manifest at the root level -->
  <link rel="manifest" href="/manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter for the app; Schibsted Grotesk / Public Sans / IBM Plex Mono for the
       Daylight public surface. One request, non-blocking, display=swap.
       Inter previously pulled 300/800/900 which nothing uses — see the weight
       audit: only font-medium, font-semibold and font-bold appear in src/. -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@400;600;700;800&family=Schibsted+Grotesk:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@400;600;700;800&family=Schibsted+Grotesk:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<script>
  // Dark mode preload — prevents white flash on refresh
  (function() {
    try {
      var darkPref = localStorage.getItem('openhr-dark-mode') || 'system';
      var isDark = darkPref === 'dark' ||
        (darkPref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isDark) {
        // Apply dark class immediately — the .dark CSS rules in the static
        // hero <style> block handle background/text overrides for both the
        // skeleton and body, so no element lookups are needed here.
        document.documentElement.classList.add('dark');

        // Update theme-color meta tag to dark
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#0E1720');
      }
    } catch(e) {}
  })();
</script>
</head>
<body class="bg-[#fcfdfe] text-slate-900">
  <div id="root">
    <!--
      Static Hero Skeleton — instant first paint for visitors & SEO crawlers.
      Mirrors HeroSection.tsx so crawlers index real content instead of a blank
      "Loading..." screen.  React replaces every child of #root on mount via
      createRoot().render(), so there is no hydration mismatch to worry about.
    -->
    <div id="static-hero">
      <!-- Static Solid Arts Staff Portal skeleton: instant first paint before React mounts.
           Mirrors StaffPortalLanding.tsx; React replaces it on mount. -->
      <style>
        #static-hero{font-family:"Libre Franklin",Inter,system-ui,sans-serif;min-height:100vh;background:#fff;color:#1e293b}
        #static-hero.sh-auth-session{display:none}
        #static-hero .sa-head{background:#9C0021}
        #static-hero .sa-bar{max-width:64rem;margin:0 auto;padding:0 1rem;height:4rem;display:flex;align-items:center;justify-content:space-between}
        #static-hero .sa-logo{height:2.25rem;width:auto}
        #static-hero .sa-login{background:#fff;color:#9C0021;font-weight:600;font-size:.875rem;padding:.5rem 1rem;border-radius:.375rem;text-decoration:none}
        #static-hero .sa-hero{background:#15212C;text-align:center;padding:4rem 1rem}
        #static-hero .sa-kicker{color:#F5A623;font-size:.75rem;font-weight:600;letter-spacing:.25em;text-transform:uppercase;margin:0 0 1rem}
        #static-hero h1{color:#fff;font-size:2.5rem;font-weight:800;margin:0}
        #static-hero .sa-sub{color:#cbd5e1;max-width:36rem;margin:1.25rem auto 0;line-height:1.6}
        #static-hero .sh-btn-dark{display:inline-block;margin-top:2.25rem;background:#9C0021;color:#fff;font-weight:600;padding:.875rem 2rem;border-radius:.375rem;text-decoration:none}
        @media (min-width:640px){#static-hero h1{font-size:3.75rem}#static-hero .sa-bar{height:5rem}#static-hero .sa-hero{padding:6rem 1rem}}
      </style>
      <header class="sa-head">
        <div class="sa-bar">
          <img class="sa-logo" src="https://solidarts.co.zw/wp-content/uploads/2025/06/logo1.png" alt="Solid Arts Creativity Studio">
          <a class="sa-login sh-btn-dark-link" href="/">Log in</a>
        </div>
      </header>
      <section class="sa-hero">
        <p class="sa-kicker">Solid Arts Creativity Studio</p>
        <h1>Staff Portal</h1>
        <p class="sa-sub">Attendance, leave and team updates for the Solid Arts team, all from your phone.</p>
        <a class="sh-btn-dark" href="/">Log in to the portal</a>
      </section>
    </div>
  </div>
<script>
  // Auth-aware: hide the landing-page skeleton when the user already has a
  // Supabase session in localStorage. This prevents authenticated users from
  // briefly seeing the landing hero on refresh / PWA cold start. Crawlers
  // (no JS / no localStorage) always see the full hero for SEO.
  (function() {
    try {
      var hasSession = false;
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key && /^sb-[a-z0-9]+-auth-token$/i.test(key)) {
          try {
            var raw = localStorage.getItem(key);
            if (raw) {
              var session = JSON.parse(raw);
              if (session && session.access_token) { hasSession = true; break; }
            }
          } catch(e) { /* corrupt entry, keep checking */ }
        }
      }
      if (hasSession) {
        var hero = document.getElementById('static-hero');
        if (hero) hero.classList.add('sh-auth-session');
      }
    } catch(e) {}
    // The hero's links are for crawlers. Following one reloads a page that is still
    // loading, so keep the tap for App.tsx to act on once React mounts.
    document.getElementById('static-hero').addEventListener('click', function(e) {
      var link = e.target.closest && e.target.closest('a');
      if (!link) return;
      e.preventDefault();
      window.__heroIntent = (link.classList.contains('sh-btn-dark') || link.classList.contains('sh-btn-dark-link')) ? 'login'
        : link.classList.contains('sh-btn-primary') ? 'register' : '';
    });
  })();
</script>
<script>
  // Capture install prompt event (must be inline, not in ESM module,
  // because on slower devices beforeinstallprompt fires before modules load)
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window.deferredPWAPrompt = e;
    window.dispatchEvent(new CustomEvent('pwa-install-available'));
    console.log('PWA: Install prompt captured');
  });

  // Track successful installation
  window.addEventListener('appinstalled', function() {
    console.log('PWA: Successfully installed');
    window.deferredPWAPrompt = null;
    window.dispatchEvent(new CustomEvent('pwa-installed'));
  });
</script>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
